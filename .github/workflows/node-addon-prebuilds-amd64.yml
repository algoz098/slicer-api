name: Node addon prebuilds (amd64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ORCASLICER_SUFFIX: "a"

jobs:
  linux-prebuild:
    name: Prebuild Linux (amd64)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout (with submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Node.js (for version detection)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure Git LFS objects are present
        run: |
          git lfs install || true
          git lfs pull || true
        shell: bash

      - name: Read addon package version
        id: pkg
        shell: bash
        run: |
          VER=$(node -p "require('./OrcaSlicerAddon/bindings/node/package.json').version")
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Try download existing prebuild for same version (linux)
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: node-addon-prebuilds-amd64.yml
          workflow_conclusion: completed
          name: prebuild-linux-${{ steps.pkg.outputs.version }}
          path: .
          search_artifacts: true
          if_no_artifact_found: ignore


      - name: Materialize downloaded linux prebuild into expected location
        shell: bash
        run: |
          ROOT="prebuild-linux-${{ steps.pkg.outputs.version }}"
          echo "Listing linux prebuild artifact roots..."
          ls -la "$ROOT" || true
          ls -la . || true
          PREBUILDS_DIR=""
          if [ -d "$ROOT" ]; then
            PREBUILDS_DIR=$(find "$ROOT" -type d -name prebuilds -print -quit 2>/dev/null || true)
          fi
          if [ -z "$PREBUILDS_DIR" ]; then
            PREBUILDS_DIR=$(find . -maxdepth 8 -type d -name prebuilds ! -path "./OrcaSlicerAddon/bindings/node/prebuilds" -print -quit 2>/dev/null || true)
          fi
          # If still not found, try to extract common archive formats and search again
          if [ -z "$PREBUILDS_DIR" ]; then
            echo "No prebuilds dir found. Trying to extract any archives under $ROOT..."
            find "$ROOT" -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
              f="$1"; dest="$(dirname "$1")"; echo "Extracting $f into $dest...";
              case "$f" in
                *.zip) unzip -o "$f" -d "$dest" >/dev/null || true ;;
                *.tar.gz|*.tgz) tar -xzf "$f" -C "$dest" || true ;;
              esac
            ' sh {} \;
            PREBUILDS_DIR=$(find "$ROOT" -type d -name prebuilds -print -quit 2>/dev/null || true)
          fi
          if [ -n "$PREBUILDS_DIR" ] && [ -n "$(ls -A "$PREBUILDS_DIR" 2>/dev/null)" ]; then
            echo "Materializing from: $PREBUILDS_DIR"
            mkdir -p OrcaSlicerAddon/bindings/node/prebuilds
            cp -R "$PREBUILDS_DIR"/* OrcaSlicerAddon/bindings/node/prebuilds/
            echo "Listing destination prebuilds after copy:"
            ls -la OrcaSlicerAddon/bindings/node/prebuilds || true
          else
            echo "No prebuilds dir found in downloaded artifacts or directory is empty"
          fi

      - name: Check if prebuild exists (linux)
        id: check_prebuilt
        shell: bash
        run: |
          if [ -d "OrcaSlicerAddon/bindings/node/prebuilds" ] && [ -n "$(ls -A OrcaSlicerAddon/bindings/node/prebuilds 2>/dev/null)" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Build OrcaSlicer + addon inside Docker (Ubuntu 22.04)
        if: steps.check_prebuilt.outputs.found != 'true'
        run: bash "$GITHUB_WORKSPACE/scripts/ci/linux_build_inside_docker.sh" "$GITHUB_WORKSPACE"
        shell: bash

      - name: List staged prebuilds
        if: steps.check_prebuilt.outputs.found != 'true'
        working-directory: OrcaSlicerAddon/bindings/node
        run: bash "$GITHUB_WORKSPACE/scripts/ci/list_staged_prebuilds.sh"
        shell: bash

      - name: Upload artifact (prebuild-linux-${{ steps.pkg.outputs.version }})
        if: steps.check_prebuilt.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-linux-${{ steps.pkg.outputs.version }}
          path: |
            OrcaSlicerAddon/bindings/node/prebuilds/**
          if-no-files-found: error

  windows-prebuild:
    name: Prebuild Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout (with submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure Git LFS objects are present
        run: |
          git lfs install || true
          git lfs pull || true
        shell: bash

      - name: Read addon package version
        id: pkg
        shell: bash
        run: |
          VER=$(node -p "require('./OrcaSlicerAddon/bindings/node/package.json').version")
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Try download existing prebuild for same version (windows)
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: node-addon-prebuilds-amd64.yml
          workflow_conclusion: completed
          name: prebuild-windows-${{ steps.pkg.outputs.version }}
          path: .
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Materialize downloaded windows prebuild into expected location
        shell: bash
        run: |
          ROOT="prebuild-windows-${{ steps.pkg.outputs.version }}"
          echo "Listing windows prebuild artifact roots..."
          ls -la "$ROOT" || true
          ls -la . || true
          PREBUILDS_DIR=""
          if [ -d "$ROOT" ]; then
            PREBUILDS_DIR=$(find "$ROOT" -type d -name prebuilds -print -quit 2>/dev/null || true)
          fi
          if [ -z "$PREBUILDS_DIR" ]; then
            PREBUILDS_DIR=$(find . -maxdepth 8 -type d -name prebuilds ! -path "./OrcaSlicerAddon/bindings/node/prebuilds" -print -quit 2>/dev/null || true)
          fi
          if [ -n "$PREBUILDS_DIR" ] && [ -n "$(ls -A "$PREBUILDS_DIR" 2>/dev/null)" ]; then
            echo "Materializing from: $PREBUILDS_DIR"
            mkdir -p OrcaSlicerAddon/bindings/node/prebuilds
            cp -R "$PREBUILDS_DIR"/* OrcaSlicerAddon/bindings/node/prebuilds/
            echo "Listing destination prebuilds after copy:"
            ls -la OrcaSlicerAddon/bindings/node/prebuilds || true
          else
            echo "No prebuilds dir found in downloaded windows artifacts or directory is empty"
          fi


      - name: Check if prebuild exists (windows)
        id: check_prebuilt
        shell: bash
        run: |
          if [ -d "OrcaSlicerAddon/bindings/node/prebuilds" ] && [ -n "$(ls -A OrcaSlicerAddon/bindings/node/prebuilds 2>/dev/null)" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Try download cached Orca build from previous successful run
        if: steps.check_prebuilt.outputs.found != 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: node-addon-prebuilds-amd64.yml
          workflow_conclusion: completed
          name: orca-build-windows
          path: .
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Materialize cached Orca build into expected location
        if: steps.check_prebuilt.outputs.found != 'true'
        shell: bash
        run: |
          echo "Contents of downloaded Windows cache artifact (orca-build-windows):"
          ls -laR orca-build-windows || true
          if [ -d "orca-build-windows/OrcaSlicer/build" ]; then
            mkdir -p OrcaSlicer
            cp -R orca-build-windows/OrcaSlicer/* OrcaSlicer/
          elif [ -d "orca-build-windows/build" ]; then
            mkdir -p OrcaSlicer
            cp -R orca-build-windows/* OrcaSlicer/
          else
            CAND=$(find orca-build-windows -type d -name OrcaSlicer -print -quit 2>/dev/null || true)
            if [ -n "$CAND" ]; then
              mkdir -p OrcaSlicer
              cp -R "$CAND"/* OrcaSlicer/
            fi
          fi
          echo "Listing OrcaSlicer after materialization:"
          ls -laR OrcaSlicer || true

      - name: Check if cached Orca build exists
        if: steps.check_prebuilt.outputs.found != 'true'
        id: check_cache
        shell: bash
        run: |
          FOUND=$(find OrcaSlicer -type f \( -iname "*slic3r*.lib" -o -iname "*slic3r*.dll" \) -print -quit 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "Cached Orca build detected at: $FOUND"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "No cached Orca build detected. Contents of OrcaSlicer (if any):"
            ls -laR OrcaSlicer || true
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Build OrcaSlicer (deps + slicer) with VS2022
        if: steps.check_prebuilt.outputs.found != 'true' && steps.check_cache.outputs.found == 'false'
        shell: cmd
        run: |
          cd OrcaSlicer
          call build_release_vs2022.bat

      - name: Upload cached Orca build for reuse
        if: steps.check_prebuilt.outputs.found != 'true' && steps.check_cache.outputs.found == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: orca-build-windows
          path: |
            OrcaSlicer/build/**
            OrcaSlicer/deps/build/**
          if-no-files-found: error
          retention-days: 7

      - name: Build Node addon prebuilds (win32-x64)
        if: steps.check_prebuilt.outputs.found != 'true'
        shell: bash
        env:
          ORCACLI_REQUIRE_LIBS: 'ON'
        run: |
          cd OrcaSlicerAddon/bindings/node
          npm ci
          npm run prebuild:all
          npm run prebuild:stage

      - name: List staged prebuilds
        if: steps.check_prebuilt.outputs.found != 'true'
        working-directory: OrcaSlicerAddon/bindings/node
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/ci/list_staged_prebuilds.sh"

      - name: Upload artifact (prebuild-windows-${{ steps.pkg.outputs.version }})
        if: steps.check_prebuilt.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-windows-${{ steps.pkg.outputs.version }}
          path: |
            OrcaSlicerAddon/bindings/node/prebuilds/**
          if-no-files-found: error

