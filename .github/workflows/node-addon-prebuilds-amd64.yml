name: Node addon prebuilds (amd64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ORCASLICER_SUFFIX: "a"

jobs:
  linux-prebuild:
    name: Prebuild Linux (amd64)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout (with submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Node.js (for version detection)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure Git LFS objects are present
        run: |
          git lfs install || true
          git lfs pull || true
        shell: bash


      - name: Ensure unzip is available (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Read addon package version
        id: pkg
        shell: bash
        run: |
          VER=$(node -p "require('./OrcaSlicerAddon/bindings/node/package.json').version")
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Try download existing prebuild for same version (linux)
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: node-addon-prebuilds-amd64.yml
          workflow_conclusion: completed
          name: prebuild-linux-${{ steps.pkg.outputs.version }}
          path: .
          search_artifacts: true
          if_no_artifact_found: ignore


      - name: Try fallback download legacy prebuild (linux)
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: node-addon-prebuilds-amd64.yml
          workflow_conclusion: completed
          name: prebuild-linux
          path: .
          search_artifacts: true
          if_no_artifact_found: ignore


      - name: Materialize downloaded linux prebuild into expected location
        shell: bash
        run: |
          ROOT="prebuild-linux-${{ steps.pkg.outputs.version }}"
          echo "Listing linux prebuild artifact roots..."
          ls -la "$ROOT" || true
          ls -la . || true
          PREBUILDS_DIR=""
          if [ -d "$ROOT" ]; then
            PREBUILDS_DIR=$(find "$ROOT" -type d -name prebuilds -print -quit 2>/dev/null || true)
          fi

          echo "[debug] After ROOT search: PREBUILDS_DIR=$PREBUILDS_DIR"

          if [ -z "$PREBUILDS_DIR" ]; then
            PREBUILDS_DIR=$(find . -maxdepth 12 -type d -name prebuilds ! -path "./OrcaSlicerAddon/bindings/node/prebuilds" -print -quit 2>/dev/null || true)
          fi

          echo "[debug] After dot search: PREBUILDS_DIR=$PREBUILDS_DIR"

          # If still not found, try to extract common archive formats and search again
          if [ -z "$PREBUILDS_DIR" ] && [ -d "$ROOT" ]; then
            echo "No prebuilds dir found. Trying to extract any archives under $ROOT..."
            find "$ROOT" -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
              f="$1"; dest="$(dirname "$1")"; echo "Extracting $f into $dest...";
              case "$f" in
                *.zip) unzip -o "$f" -d "$dest" >/dev/null || true ;;
                *.tar.gz|*.tgz) tar -xzf "$f" -C "$dest" || true ;;
              esac
            ' sh {} \; 2>/dev/null || true
            PREBUILDS_DIR=$(find "$ROOT" -type d -name prebuilds -print -quit 2>/dev/null || true)
          fi
          # If ROOT directory is not present, also try extracting archives from current directory

          echo "[debug] After extraction under ROOT: PREBUILDS_DIR=$PREBUILDS_DIR"
          [ -n "$PREBUILDS_DIR" ] && ls -la "$PREBUILDS_DIR" || true

          if [ -z "$PREBUILDS_DIR" ] && [ ! -d "$ROOT" ]; then
            echo "No prebuilds dir found and $ROOT not present. Trying to extract any archives under current dir..."
            find . -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
              f="$1"; dest="$(dirname "$1")"; echo "Extracting $f into $dest...";
              case "$f" in
                *.zip) unzip -o "$f" -d "$dest" >/dev/null || true ;;
                *.tar.gz|*.tgz) tar -xzf "$f" -C "$dest" || true ;;
              esac
            ' sh {} \; 2>/dev/null || true
            PREBUILDS_DIR=$(find . -type d -name prebuilds -print -quit 2>/dev/null || true)

          echo "[debug] After extraction under dot: PREBUILDS_DIR=$PREBUILDS_DIR"
          [ -n "$PREBUILDS_DIR" ] && ls -la "$PREBUILDS_DIR" || true



          fi

          if [ -n "$PREBUILDS_DIR" ] && [ -n "$(ls -A "$PREBUILDS_DIR" 2>/dev/null)" ]; then
            echo "Materializing from: $PREBUILDS_DIR"
            mkdir -p OrcaSlicerAddon/bindings/node/prebuilds
            cp -R "$PREBUILDS_DIR"/* OrcaSlicerAddon/bindings/node/prebuilds/

            echo "Listing source prebuilds before copy:"
            ls -la "$PREBUILDS_DIR" || true

            echo "Listing destination prebuilds after copy:"
            ls -la OrcaSlicerAddon/bindings/node/prebuilds || true
          else
            echo "No prebuilds dir found in downloaded artifacts or directory is empty"
          fi

      - name: Check if prebuild exists (linux)
        id: check_prebuilt
        shell: bash
        run: |
          DEST="OrcaSlicerAddon/bindings/node/prebuilds"
          ROOT="prebuild-linux-${{ steps.pkg.outputs.version }}"
          echo "[gate] DEST=$DEST ROOT=$ROOT"
          ls -la "$DEST" 2>/dev/null || true

          if [ -d "$DEST" ] && [ -n "$(ls -A "$DEST" 2>/dev/null || true)" ]; then
            echo "[gate] DEST already has content; skipping build"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            # Try to expose prebuilds by extracting common archives first (under ROOT and .)
            if [ -d "$ROOT" ]; then
              find "$ROOT" -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
                f="$1"; dest="$(dirname "$1")"; echo "[gate] Extracting $f into $dest...";
                case "$f" in
                  *.zip) unzip -o "$f" -d "$dest" >/dev/null || true ;;
                  *.tar.gz|*.tgz) tar -xzf "$f" -C "$dest" || true ;;
                esac
              ' sh {} \; 2>/dev/null || true
            fi
            find . -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
              f="$1"; dest="$(dirname "$1")"; echo "[gate] Extracting $f into $dest...";
              case "$f" in
                *.zip) unzip -o "$f" -d "$dest" >/dev/null || true ;;
                *.tar.gz|*.tgz) tar -xzf "$f" -C "$dest" || true ;;
              esac
            ' sh {} \; 2>/dev/null || true

            # Option A: prefer directories literally named 'prebuilds' (excluding DEST)
            CANDS=$(find . -maxdepth 12 -type d -name prebuilds ! -path "./$DEST" -print 2>/dev/null || true)
            echo "[gate] Candidates (prebuilds dirs):"; printf "%s\n" "$CANDS" | sed 's/^/[gate]  - /'
            SRC=""
            while IFS= read -r d; do
              [ -n "$d" ] || continue
              if [ -n "$(ls -A "$d" 2>/dev/null || true)" ]; then SRC="$d"; break; fi
            done <<< "$CANDS"

            if [ -z "$SRC" ]; then
              # Option B: fall back to any .node files and reconstruct under DEST preserving subpath after 'prebuilds/' if present
              echo "[gate] No prebuilds dir candidates with content; searching for .node files..."
              mapfile -t NODE_FILES < <(find . -maxdepth 12 -type f -name "*.node" -print 2>/dev/null || true)
              if [ "${#NODE_FILES[@]}" -gt 0 ]; then
                mkdir -p "$DEST"
                for f in "${NODE_FILES[@]}"; do
                  case "$f" in
                    *prebuilds/*)
                      rel="${f#*prebuilds/}"; mkdir -p "$DEST/$(dirname "$rel")"; cp -f "$f" "$DEST/$rel" ;;
                    *)
                      cp -f "$f" "$DEST/" ;;
                  esac
                done
                echo "[gate] Copied $(ls -1 "$DEST" | wc -l | tr -d " ") files into $DEST"
              fi
            else
              echo "[gate] Found prebuilds dir candidate: $SRC; materializing into $DEST"
              mkdir -p "$DEST"
              cp -R "$SRC"/* "$DEST"/ || true
            fi

            if [ -d "$DEST" ] && [ -n "$(ls -A "$DEST" 2>/dev/null || true)" ]; then
              echo "[gate] Prebuilds present at $DEST after recovery"
              echo "found=true" >> $GITHUB_OUTPUT
            else
              echo "[gate] No valid prebuilds found; will trigger build"
              echo "found=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Build OrcaSlicer + addon inside Docker (Ubuntu 22.04)
        if: steps.check_prebuilt.outputs.found == 'false'
        run: bash "$GITHUB_WORKSPACE/scripts/ci/linux_build_inside_docker.sh" "$GITHUB_WORKSPACE"
        shell: bash

      - name: List staged prebuilds
        if: steps.check_prebuilt.outputs.found == 'false'
        working-directory: OrcaSlicerAddon/bindings/node
        run: bash "$GITHUB_WORKSPACE/scripts/ci/list_staged_prebuilds.sh"
        shell: bash

      - name: Upload artifact (prebuild-linux-${{ steps.pkg.outputs.version }})
        if: steps.check_prebuilt.outputs.found == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-linux-${{ steps.pkg.outputs.version }}
          path: |
            OrcaSlicerAddon/bindings/node/prebuilds/**
          if-no-files-found: error

  windows-prebuild:
    name: Prebuild Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout (with submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure Git LFS objects are present
        run: |
          git lfs install || true
          git lfs pull || true
        shell: bash

      - name: Read addon package version
        id: pkg
        shell: bash
        run: |
          VER=$(node -p "require('./OrcaSlicerAddon/bindings/node/package.json').version")
          echo "version=$VER" >> $GITHUB_OUTPUT


      - name: Find repo-wide prebuild artifact by name+version (windows)
        id: find_repo_prebuild_win
        uses: actions/github-script@v7
        env:
          TARGET_NAME: prebuild-windows-${{ steps.pkg.outputs.version }}
        with:
          script: |
            const target = process.env.TARGET_NAME;
            const perPage = 100;
            let page = 1;
            let best = null;
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: perPage,
                page,
              });
              const artifacts = data.artifacts || [];
              if (artifacts.length === 0) break;
              for (const a of artifacts) {
                if (!a.expired && a.name === target) {
                  if (!best || new Date(a.created_at) > new Date(best.created_at)) best = a;
                }
              }
              if (artifacts.length < perPage) break;
              page++;
            }
            if (best && best.workflow_run && best.workflow_run.id) {
              core.setOutput('run_id', String(best.workflow_run.id));
              core.setOutput('artifact_name', best.name);
            } else {
              core.setOutput('run_id', '');
              core.setOutput('artifact_name', '');
            }

      - name: Download repo-wide prebuild by name+version (windows)
        if: steps.find_repo_prebuild_win.outputs.run_id != ''
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.find_repo_prebuild_win.outputs.run_id }}
          name: ${{ steps.find_repo_prebuild_win.outputs.artifact_name }}
          path: prebuild-windows-${{ steps.pkg.outputs.version }}
          if_no_artifact_found: ignore

      - name: Try download existing prebuild for same version (windows)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: node-addon-prebuilds-amd64.yml
          workflow_conclusion: ""
          name: prebuild-windows-${{ steps.pkg.outputs.version }}
          path: .
          search_artifacts: true
          if_no_artifact_found: ignore


      - name: Try fallback download legacy prebuild (windows)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: node-addon-prebuilds-amd64.yml
          workflow_conclusion: ""
          name: prebuild-windows
          path: .
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Materialize downloaded windows prebuild into expected location
        shell: bash
        run: |
          ROOT="prebuild-windows-${{ steps.pkg.outputs.version }}"
          echo "Listing windows prebuild artifact roots..."
          ls -la "$ROOT" || true
          ls -la . || true
          PREBUILDS_DIR=""
          if [ -d "$ROOT" ]; then
            PREBUILDS_DIR=$(find "$ROOT" -type d -name prebuilds -print -quit 2>/dev/null || true)
          fi

          echo "[debug] After ROOT search (win): PREBUILDS_DIR=$PREBUILDS_DIR"

          if [ -z "$PREBUILDS_DIR" ]; then
            PREBUILDS_DIR=$(find . -maxdepth 12 -type d -name prebuilds ! -path "./OrcaSlicerAddon/bindings/node/prebuilds" -print -quit 2>/dev/null || true)
          fi

          echo "[debug] After dot search (win): PREBUILDS_DIR=$PREBUILDS_DIR"

          # Try to extract archives under ROOT if not found yet
          if [ -z "$PREBUILDS_DIR" ] && [ -d "$ROOT" ]; then
            echo "No prebuilds dir found. Trying to extract any archives under $ROOT (win)..."
            find "$ROOT" -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
              f="$1"; dest="$(dirname "$1")"; echo "Extracting $f into $dest...";
              tar -xf "$f" -C "$dest" 2>/dev/null || tar -xzf "$f" -C "$dest" 2>/dev/null || { command -v unzip >/dev/null 2>&1 && unzip -o "$f" -d "$dest" >/dev/null; } || true
            ' sh {} \; 2>/dev/null || true
            PREBUILDS_DIR=$(find "$ROOT" -type d -name prebuilds -print -quit 2>/dev/null || true)
            echo "[debug] After extraction under ROOT (win): PREBUILDS_DIR=$PREBUILDS_DIR"
            [ -n "$PREBUILDS_DIR" ] && ls -la "$PREBUILDS_DIR" || true
          fi

          # If ROOT not present, try extracting from current directory
          if [ -z "$PREBUILDS_DIR" ] && [ ! -d "$ROOT" ]; then
            echo "No prebuilds dir found and $ROOT not present. Trying to extract any archives under current dir (win)..."
            find . -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
              f="$1"; dest="$(dirname "$1")"; echo "Extracting $f into $dest...";
              tar -xf "$f" -C "$dest" 2>/dev/null || tar -xzf "$f" -C "$dest" 2>/dev/null || { command -v unzip >/dev/null 2>&1 && unzip -o "$f" -d "$dest" >/dev/null; } || true
            ' sh {} \; 2>/dev/null || true
            PREBUILDS_DIR=$(find . -type d -name prebuilds -print -quit 2>/dev/null || true)
            echo "[debug] After extraction under dot (win): PREBUILDS_DIR=$PREBUILDS_DIR"
            [ -n "$PREBUILDS_DIR" ] && ls -la "$PREBUILDS_DIR" || true
          fi

          if [ -n "$PREBUILDS_DIR" ] && [ -n "$(ls -A "$PREBUILDS_DIR" 2>/dev/null)" ]; then
            echo "Materializing from: $PREBUILDS_DIR"
            mkdir -p OrcaSlicerAddon/bindings/node/prebuilds

            echo "Listing source prebuilds before copy (win):"
            ls -la "$PREBUILDS_DIR" || true

            cp -R "$PREBUILDS_DIR"/* OrcaSlicerAddon/bindings/node/prebuilds/
            echo "Listing destination prebuilds after copy:"
            ls -la OrcaSlicerAddon/bindings/node/prebuilds || true
          else
            echo "No prebuilds dir found in downloaded windows artifacts or directory is empty"
          fi


      - name: Check if prebuild exists (windows)
        id: check_prebuilt
        shell: bash
        run: |
          DEST="OrcaSlicerAddon/bindings/node/prebuilds"
          ROOT="prebuild-windows-${{ steps.pkg.outputs.version }}"
          # 0) Try to expose content by extracting any archives (works even if unzip is missing via tar)
          if [ -d "$ROOT" ]; then
            find "$ROOT" -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
              f="$1"; dest="$(dirname "$1")"; echo "[win-gate] Extracting $f into $dest...";
              tar -xf "$f" -C "$dest" 2>/dev/null || tar -xzf "$f" -C "$dest" 2>/dev/null || { command -v unzip >/dev/null 2>&1 && unzip -o "$f" -d "$dest" >/dev/null; } || true
            ' sh {} \; 2>/dev/null || true
          fi
          find . -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
            f="$1"; dest="$(dirname "$1")"; echo "[win-gate] Extracting $f into $dest...";
            tar -xf "$f" -C "$dest" 2>/dev/null || tar -xzf "$f" -C "$dest" 2>/dev/null || { command -v unzip >/dev/null 2>&1 && unzip -o "$f" -d "$dest" >/dev/null; } || true
          ' sh {} \; 2>/dev/null || true

          # 1) If DEST already has content
          if [ -d "$DEST" ] && [ -n "$(ls -A "$DEST" 2>/dev/null || true)" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            # 2) Prefer directories named prebuilds (excluding DEST)
            CANDS=$(find . -maxdepth 12 -type d -name prebuilds ! -path "./$DEST" -print 2>/dev/null || true)
            SRC=""
            while IFS= read -r d; do
              [ -n "$d" ] || continue
              if [ -n "$(ls -A "$d" 2>/dev/null || true)" ]; then SRC="$d"; break; fi
            done <<< "$CANDS"

            # 3) Fallback: any .node files; otherwise, if a prebuilds dir candidate exists, materialize it
            if [ -z "$SRC" ]; then
              NODE_FILES=$(find . -maxdepth 12 -type f -name "*.node" -print 2>/dev/null || true)
              if [ -n "$NODE_FILES" ]; then
                mkdir -p "$DEST"
                while IFS= read -r f; do
                  [ -n "$f" ] || continue
                  case "$f" in
                    *prebuilds/*)
                      rel="${f#*prebuilds/}"; mkdir -p "$DEST/$(dirname "$rel")"; cp -f "$f" "$DEST/$rel" ;;
                    *)
                      cp -f "$f" "$DEST/" ;;
                  esac
                done <<< "$NODE_FILES"
              fi
            else
              echo "[win-gate] Found prebuilds dir candidate: $SRC; materializing into $DEST"
              mkdir -p "$DEST"
              cp -R "$SRC"/* "$DEST"/ || true
            fi

            # 4) Final decision
            if [ -d "$DEST" ] && [ -n "$(ls -A "$DEST" 2>/dev/null || true)" ]; then
              echo "found=true" >> $GITHUB_OUTPUT
            else
              echo "found=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Find repo-wide Orca CLI artifact (Windows)
        if: steps.check_prebuilt.outputs.found == 'false'
        id: find_repo_orcawin
        uses: actions/github-script@v7
        with:
          script: |
            const perPage = 100;
            let page = 1;
            let best = null;
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: perPage,
                page,
              });
              const artifacts = data.artifacts || [];
              if (artifacts.length === 0) break;
              for (const a of artifacts) {
                if (!a.expired && a.name === 'orcaslicer-cli-Windows') {
                  if (!best || new Date(a.created_at) > new Date(best.created_at)) best = a;
                }
              }
              if (artifacts.length < perPage) break;
              page++;
            }
            core.setOutput('run_id', best && best.workflow_run ? String(best.workflow_run.id) : '');
            core.setOutput('artifact_name', best ? best.name : '');

      - name: Download repo-wide Orca CLI (Windows)
        if: steps.check_prebuilt.outputs.found == 'false' && steps.find_repo_orcawin.outputs.run_id != ''
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.find_repo_orcawin.outputs.run_id }}
          name: ${{ steps.find_repo_orcawin.outputs.artifact_name }}
          path: orca-cli-windows
          if_no_artifact_found: ignore

      - name: Materialize Orca CLI artifact into OrcaSlicer
        if: steps.check_prebuilt.outputs.found == 'false' && steps.find_repo_orcawin.outputs.run_id != ''
        shell: bash
        run: |
          echo "Contents of downloaded Orca CLI artifact (orcaslicer-cli-Windows):"
          ls -laR orca-cli-windows || true
          # Extract any nested archives first
          find orca-cli-windows -maxdepth 4 -type f \( -iname "*.zip" -o -iname "*.tar" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
            f="$1"; dest="$(dirname "$1")"; echo "[cli] Extracting $f into $dest...";
            tar -xf "$f" -C "$dest" 2>/dev/null || tar -xzf "$f" -C "$dest" 2>/dev/null || { command -v unzip >/dev/null 2>&1 && unzip -o "$f" -d "$dest" >/dev/null; } || true
          ' sh {} \; 2>/dev/null || true

          mkdir -p OrcaSlicer
          if [ -d "orca-cli-windows/OrcaSlicer/build" ] || [ -d "orca-cli-windows/OrcaSlicer/deps/build" ]; then
            cp -R orca-cli-windows/OrcaSlicer/* OrcaSlicer/
          else
            CAND=$(find orca-cli-windows -type d -name OrcaSlicer -print -quit 2>/dev/null || true)
            if [ -n "$CAND" ]; then
              cp -R "$CAND"/* OrcaSlicer/
            else
              BUILD_DIR=$(find orca-cli-windows -type d -name build -print -quit 2>/dev/null || true)
              if [ -n "$BUILD_DIR" ]; then
                PARENT="$(dirname "$BUILD_DIR")"
                echo "[cli] Found build dir at $BUILD_DIR; copying parent $PARENT into OrcaSlicer/"
                cp -R "$PARENT"/* OrcaSlicer/
              else
                echo "[cli] No structured build dirs found; copying all contents into OrcaSlicer/"
                cp -R orca-cli-windows/* OrcaSlicer/ || true
              fi
            fi
          fi
          echo "Listing OrcaSlicer after CLI materialization:"
          ls -laR OrcaSlicer || true

      - name: Try download cached Orca build from previous successful run
        if: steps.check_prebuilt.outputs.found == 'false'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: node-addon-prebuilds-amd64.yml
          workflow_conclusion: ""
          name: orca-build-windows
          path: .
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Materialize cached Orca build into expected location
        if: steps.check_prebuilt.outputs.found == 'false'
        shell: bash
        run: |
          echo "Contents of downloaded Windows cache artifact (orca-build-windows):"
          ls -laR orca-build-windows || true
          # Try to expose content by extracting any nested archives first (zip/tar/tgz)
          find orca-build-windows -maxdepth 4 -type f \( -iname "*.zip" -o -iname "*.tar" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
            f="$1"; dest="$(dirname "$1")"; echo "[cache] Extracting $f into $dest...";
            tar -xf "$f" -C "$dest" 2>/dev/null || tar -xzf "$f" -C "$dest" 2>/dev/null || { command -v unzip >/dev/null 2>&1 && unzip -o "$f" -d "$dest" >/dev/null; } || true
          ' sh {} \; 2>/dev/null || true

          mkdir -p OrcaSlicer
          if [ -d "orca-build-windows/OrcaSlicer/build" ] || [ -d "orca-build-windows/OrcaSlicer/deps/build" ]; then
            cp -R orca-build-windows/OrcaSlicer/* OrcaSlicer/
          else
            CAND=$(find orca-build-windows -type d -name OrcaSlicer -print -quit 2>/dev/null || true)
            if [ -n "$CAND" ]; then
              cp -R "$CAND"/* OrcaSlicer/
            else
              BUILD_DIR=$(find orca-build-windows -type d -name build -print -quit 2>/dev/null || true)
              if [ -n "$BUILD_DIR" ]; then
                PARENT="$(dirname "$BUILD_DIR")"
                echo "[cache] Found build dir at $BUILD_DIR; copying parent $PARENT into OrcaSlicer/"
                cp -R "$PARENT"/* OrcaSlicer/
              fi
            fi
          fi
          echo "Listing OrcaSlicer after materialization:"
          ls -laR OrcaSlicer || true

      - name: Check if cached Orca build exists
        if: steps.check_prebuilt.outputs.found == 'false'
        id: check_cache
        shell: bash
        run: |
          # Consider cache present if there is any non-empty 'build' directory under OrcaSlicer
          BUILD_FOUND=$(find OrcaSlicer -maxdepth 4 -type d -name build -print -quit 2>/dev/null || true)
          if [ -n "$BUILD_FOUND" ] && [ -n "$(ls -A "$BUILD_FOUND" 2>/dev/null || true)" ]; then
            echo "Cached Orca build directory structure present at: $BUILD_FOUND"
            echo "found=true" >> $GITHUB_OUTPUT
          elif [ -d "OrcaSlicer/deps/build" ] && [ -n "$(ls -A "OrcaSlicer/deps/build" 2>/dev/null || true)" ]; then
            echo "Cached Orca deps build present."
            echo "found=true" >> $GITHUB_OUTPUT
          else
            # Additional heuristics: VS multi-config dirs or any binary outputs
            CONFIG_DIR=$(find OrcaSlicer -maxdepth 6 -type d \( -name RelWithDebInfo -o -name Release -o -name Debug -o -name MinSizeRel \) -print -quit 2>/dev/null || true)
            if [ -n "$CONFIG_DIR" ]; then
              echo "Found VS config dir under OrcaSlicer: $CONFIG_DIR"
              echo "found=true" >> $GITHUB_OUTPUT
            else
              ANY_BIN=$(find OrcaSlicer -maxdepth 8 -type f \( -iname "*.lib" -o -iname "*.dll" -o -iname "*.pdb" \) -print -quit 2>/dev/null || true)
              if [ -n "$ANY_BIN" ]; then
                echo "Found binary outputs under OrcaSlicer (e.g., .lib/.dll/.pdb): $ANY_BIN"
                echo "found=true" >> $GITHUB_OUTPUT
              else
                echo "No cached Orca build detected. Contents of OrcaSlicer (if any):"
                ls -laR OrcaSlicer || true
                echo "found=false" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      - name: Build OrcaSlicer (deps + slicer) with VS2022
        if: steps.check_prebuilt.outputs.found == 'false' && steps.check_cache.outputs.found == 'false'
        shell: cmd
        run: |
          cd OrcaSlicer
          call build_release_vs2022.bat

      - name: Upload cached Orca build for reuse
        if: steps.check_prebuilt.outputs.found == 'false' && steps.check_cache.outputs.found == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: orca-build-windows
          path: |
            OrcaSlicer/build/**
            OrcaSlicer/deps/build/**
          if-no-files-found: error
          retention-days: 7

      - name: Build Node addon prebuilds (win32-x64)
        if: steps.check_prebuilt.outputs.found == 'false'
        shell: bash
        env:
          ORCACLI_REQUIRE_LIBS: 'ON'
        run: |
          cd OrcaSlicerAddon/bindings/node
          npm ci
          npm run prebuild:all
          npm run prebuild:stage

      - name: List staged prebuilds
        if: steps.check_prebuilt.outputs.found == 'false'
        working-directory: OrcaSlicerAddon/bindings/node
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/ci/list_staged_prebuilds.sh"

      - name: Upload artifact (prebuild-windows-${{ steps.pkg.outputs.version }})
        if: steps.check_prebuilt.outputs.found == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-windows-${{ steps.pkg.outputs.version }}
          path: |
            OrcaSlicerAddon/bindings/node/prebuilds/**
          if-no-files-found: error

