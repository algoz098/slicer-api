name: Node addon prebuilds (amd64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  linux-prebuild:
    name: Prebuild Linux (amd64)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout (with submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Node.js (for version detection)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set ORCASLICER_SUFFIX from VERSION_SUFFIX
        run: echo "ORCASLICER_SUFFIX=$(cat VERSION_SUFFIX)" >> $GITHUB_ENV
        shell: bash

      - name: Ensure Git LFS objects are present
        run: |
          git lfs install || true
          git lfs pull || true
        shell: bash


      - name: Ensure unzip is available (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Read addon package version
        id: pkg
        shell: bash
        run: |
          VER=$(node -p "require('./OrcaSlicerAddon/bindings/node/package.json').version")
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Try download existing prebuild (linux, unversioned)
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: node-addon-prebuilds-amd64.yml
          workflow_conclusion: completed
          name: prebuild-linux
          path: .
          search_artifacts: true
          if_no_artifact_found: ignore


      - name: Try fallback download legacy prebuild (linux)
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: node-addon-prebuilds-amd64.yml
          workflow_conclusion: completed
          name: prebuild-linux
          path: .
          search_artifacts: true
          if_no_artifact_found: ignore


      - name: Materialize downloaded linux prebuild into expected location
        shell: bash
        run: |
          ROOT="prebuild-linux"
          echo "Listing linux prebuild artifact roots..."
          ls -la "$ROOT" || true
          ls -la . || true
          PREBUILDS_DIR=""
          if [ -d "$ROOT" ]; then
            PREBUILDS_DIR=$(find "$ROOT" -type d -name prebuilds -print -quit 2>/dev/null || true)
          fi

          echo "[debug] After ROOT search: PREBUILDS_DIR=$PREBUILDS_DIR"

          if [ -z "$PREBUILDS_DIR" ]; then
            PREBUILDS_DIR=$(find . -maxdepth 12 -type d -name prebuilds ! -path "./OrcaSlicerAddon/bindings/node/prebuilds" -print -quit 2>/dev/null || true)
          fi

          echo "[debug] After dot search: PREBUILDS_DIR=$PREBUILDS_DIR"

          # If still not found, try to extract common archive formats and search again
          if [ -z "$PREBUILDS_DIR" ] && [ -d "$ROOT" ]; then
            echo "No prebuilds dir found. Trying to extract any archives under $ROOT..."
            find "$ROOT" -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
              f="$1"; dest="$(dirname "$1")"; echo "Extracting $f into $dest...";
              case "$f" in
                *.zip) unzip -o "$f" -d "$dest" >/dev/null || true ;;
                *.tar.gz|*.tgz) tar -xzf "$f" -C "$dest" || true ;;
              esac
            ' sh {} \; 2>/dev/null || true
            PREBUILDS_DIR=$(find "$ROOT" -type d -name prebuilds -print -quit 2>/dev/null || true)
          fi
          # If ROOT directory is not present, also try extracting archives from current directory

          echo "[debug] After extraction under ROOT: PREBUILDS_DIR=$PREBUILDS_DIR"
          [ -n "$PREBUILDS_DIR" ] && ls -la "$PREBUILDS_DIR" || true

          if [ -z "$PREBUILDS_DIR" ] && [ ! -d "$ROOT" ]; then
            echo "No prebuilds dir found and $ROOT not present. Trying to extract any archives under current dir..."
            find . -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
              f="$1"; dest="$(dirname "$1")"; echo "Extracting $f into $dest...";
              case "$f" in
                *.zip) unzip -o "$f" -d "$dest" >/dev/null || true ;;
                *.tar.gz|*.tgz) tar -xzf "$f" -C "$dest" || true ;;
              esac
            ' sh {} \; 2>/dev/null || true
            PREBUILDS_DIR=$(find . -type d -name prebuilds -print -quit 2>/dev/null || true)

          echo "[debug] After extraction under dot: PREBUILDS_DIR=$PREBUILDS_DIR"
          [ -n "$PREBUILDS_DIR" ] && ls -la "$PREBUILDS_DIR" || true



          fi

          if [ -n "$PREBUILDS_DIR" ] && [ -n "$(ls -A "$PREBUILDS_DIR" 2>/dev/null)" ]; then
            echo "Materializing from: $PREBUILDS_DIR"
            mkdir -p OrcaSlicerAddon/bindings/node/prebuilds
            cp -R "$PREBUILDS_DIR"/* OrcaSlicerAddon/bindings/node/prebuilds/

            echo "Listing source prebuilds before copy:"
            ls -la "$PREBUILDS_DIR" || true

            echo "Listing destination prebuilds after copy:"
            ls -la OrcaSlicerAddon/bindings/node/prebuilds || true
          else
            echo "No prebuilds dir found in downloaded artifacts or directory is empty"
          fi

      - name: Check if prebuild exists (linux)
        id: check_prebuilt
        shell: bash
        run: |
          DEST="OrcaSlicerAddon/bindings/node/prebuilds"
          ROOT="prebuild-linux"
          echo "[gate] DEST=$DEST ROOT=$ROOT"
          ls -la "$DEST" 2>/dev/null || true

          if [ -d "$DEST" ] && [ -n "$(ls -A "$DEST" 2>/dev/null || true)" ]; then
            echo "[gate] DEST already has content; skipping build"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            # Try to expose prebuilds by extracting common archives first (under ROOT and .)
            if [ -d "$ROOT" ]; then
              find "$ROOT" -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
                f="$1"; dest="$(dirname "$1")"; echo "[gate] Extracting $f into $dest...";
                case "$f" in
                  *.zip) unzip -o "$f" -d "$dest" >/dev/null || true ;;
                  *.tar.gz|*.tgz) tar -xzf "$f" -C "$dest" || true ;;
                esac
              ' sh {} \; 2>/dev/null || true
            fi
            find . -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
              f="$1"; dest="$(dirname "$1")"; echo "[gate] Extracting $f into $dest...";
              case "$f" in
                *.zip) unzip -o "$f" -d "$dest" >/dev/null || true ;;
                *.tar.gz|*.tgz) tar -xzf "$f" -C "$dest" || true ;;
              esac
            ' sh {} \; 2>/dev/null || true

            # Option A: prefer directories literally named 'prebuilds' (excluding DEST)
            CANDS=$(find . -maxdepth 12 -type d -name prebuilds ! -path "./$DEST" -print 2>/dev/null || true)
            echo "[gate] Candidates (prebuilds dirs):"; printf "%s\n" "$CANDS" | sed 's/^/[gate]  - /'
            SRC=""
            while IFS= read -r d; do
              [ -n "$d" ] || continue
              if [ -n "$(ls -A "$d" 2>/dev/null || true)" ]; then SRC="$d"; break; fi
            done <<< "$CANDS"

            if [ -z "$SRC" ]; then
              # Option B: fall back to any .node files and reconstruct under DEST preserving subpath after 'prebuilds/' if present
              echo "[gate] No prebuilds dir candidates with content; searching for .node files..."
              mapfile -t NODE_FILES < <(find . -maxdepth 12 -type f -name "*.node" -print 2>/dev/null || true)
              if [ "${#NODE_FILES[@]}" -gt 0 ]; then
                mkdir -p "$DEST"
                for f in "${NODE_FILES[@]}"; do
                  case "$f" in
                    *prebuilds/*)
                      rel="${f#*prebuilds/}"; mkdir -p "$DEST/$(dirname "$rel")"; cp -f "$f" "$DEST/$rel" ;;
                    *)
                      cp -f "$f" "$DEST/" ;;
                  esac
                done
                echo "[gate] Copied $(ls -1 "$DEST" | wc -l | tr -d " ") files into $DEST"
              fi
            else
              echo "[gate] Found prebuilds dir candidate: $SRC; materializing into $DEST"
              mkdir -p "$DEST"
              cp -R "$SRC"/* "$DEST"/ || true
            fi

            if [ -d "$DEST" ] && [ -n "$(ls -A "$DEST" 2>/dev/null || true)" ]; then
              echo "[gate] Prebuilds present at $DEST after recovery"
              echo "found=true" >> $GITHUB_OUTPUT
            else
              echo "[gate] No valid prebuilds found; will trigger build"
              echo "found=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Build OrcaSlicer + addon inside Docker (Ubuntu 22.04)
        if: steps.check_prebuilt.outputs.found == 'false'
        run: bash "$GITHUB_WORKSPACE/scripts/ci/linux_build_inside_docker.sh" "$GITHUB_WORKSPACE"
        shell: bash

      - name: List staged prebuilds
        if: steps.check_prebuilt.outputs.found == 'false'
        working-directory: OrcaSlicerAddon/bindings/node
        run: bash "$GITHUB_WORKSPACE/scripts/ci/list_staged_prebuilds.sh"
        shell: bash

      - name: Upload artifact (prebuild-linux)
        if: steps.check_prebuilt.outputs.found == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-linux
          path: |
            OrcaSlicerAddon/bindings/node/prebuilds/**
          if-no-files-found: error

  windows-prebuild:
    name: Prebuild Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout (with submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure Git LFS objects are present
        run: |
          git lfs install || true
          git lfs pull || true
        shell: bash

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Strawberry Perl (required by OpenSSL build on Windows)
        shell: pwsh
        run: choco install strawberryperl -y


      - name: Ensure Strawberry Perl in PATH (global)
        shell: pwsh
        run: |
          $perlBin = "C:\Strawberry\perl\bin"
          if (Test-Path $perlBin) { $perlBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          perl -v

      - name: Setup MSVC Developer Command Prompt (nmake/cl)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      - name: Setup CMake 3.31.x
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"

      - name: Show CMake version
        shell: bash
        run: cmake --version


      - name: Read addon package version
        id: pkg
        shell: bash
        run: |
          VER=$(node -p "require('./OrcaSlicerAddon/bindings/node/package.json').version")
          echo "version=$VER" >> $GITHUB_OUTPUT


      - name: Find repo-wide prebuild artifact by name+version (windows)
        id: find_repo_prebuild_win
        uses: actions/github-script@v7
        env:
          TARGET_NAME: prebuild-windows-${{ steps.pkg.outputs.version }}
        with:
          script: |
            const target = process.env.TARGET_NAME;
            const perPage = 100;
            let page = 1;
            let best = null;
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: perPage,
                page,
              });
              const artifacts = data.artifacts || [];
              if (artifacts.length === 0) break;
              for (const a of artifacts) {
                if (!a.expired && a.name === target) {
                  if (!best || new Date(a.created_at) > new Date(best.created_at)) best = a;
                }
              }
              if (artifacts.length < perPage) break;
              page++;
            }
            if (best && best.workflow_run && best.workflow_run.id) {
              core.setOutput('run_id', String(best.workflow_run.id));
              core.setOutput('artifact_name', best.name);
            } else {
              core.setOutput('run_id', '');
              core.setOutput('artifact_name', '');
            }

      - name: Download repo-wide prebuild by name+version (windows)
        if: steps.find_repo_prebuild_win.outputs.run_id != ''
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.find_repo_prebuild_win.outputs.run_id }}
          name: ${{ steps.find_repo_prebuild_win.outputs.artifact_name }}
          path: prebuild-windows-${{ steps.pkg.outputs.version }}
          if_no_artifact_found: ignore

      - name: Try download existing prebuild (windows, versioned)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: node-addon-prebuilds-amd64.yml
          workflow_conclusion: ""
          name: prebuild-windows-${{ steps.pkg.outputs.version }}
          path: prebuild-windows-${{ steps.pkg.outputs.version }}
          search_artifacts: true
          if_no_artifact_found: ignore


      - name: Try fallback download legacy prebuild (windows, versioned)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: node-addon-prebuilds-amd64.yml
          workflow_conclusion: ""
          name: prebuild-windows-${{ steps.pkg.outputs.version }}
          path: prebuild-windows-${{ steps.pkg.outputs.version }}
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Materialize downloaded windows prebuild into expected location
        shell: bash
        run: |
          ROOT="prebuild-windows-${{ steps.pkg.outputs.version }}"
          echo "Listing windows prebuild artifact roots..."
          ls -la "$ROOT" || true
          ls -la . || true
          PREBUILDS_DIR=""

          if [ -d "$ROOT" ]; then
            PREBUILDS_DIR=$(find "$ROOT" -type d -name prebuilds -print -quit 2>/dev/null || true)
          fi

          echo "[debug] After ROOT search (win): PREBUILDS_DIR=$PREBUILDS_DIR"

          if [ -z "$PREBUILDS_DIR" ]; then
            PREBUILDS_DIR=$(find . -maxdepth 12 -type d -name prebuilds ! -path "./OrcaSlicerAddon/bindings/node/prebuilds" -print -quit 2>/dev/null || true)
          fi

          echo "[debug] After dot search (win): PREBUILDS_DIR=$PREBUILDS_DIR"

          # Try to extract archives under ROOT if not found yet
          if [ -z "$PREBUILDS_DIR" ] && [ -d "$ROOT" ]; then
            echo "No prebuilds dir found. Trying to extract any archives under $ROOT (win)..."
            find "$ROOT" -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
              f="$1"; dest="$(dirname "$1")"; echo "Extracting $f into $dest...";
              tar -xf "$f" -C "$dest" 2>/dev/null || tar -xzf "$f" -C "$dest" 2>/dev/null || { command -v unzip >/dev/null 2>&1 && unzip -o "$f" -d "$dest" >/dev/null; } || true
            ' sh {} \; 2>/dev/null || true
            PREBUILDS_DIR=$(find "$ROOT" -type d -name prebuilds -print -quit 2>/dev/null || true)
            echo "[debug] After extraction under ROOT (win): PREBUILDS_DIR=$PREBUILDS_DIR"
            [ -n "$PREBUILDS_DIR" ] && ls -la "$PREBUILDS_DIR" || true
          fi

          # If ROOT not present, try extracting from current directory
          if [ -z "$PREBUILDS_DIR" ] && [ ! -d "$ROOT" ]; then
            echo "No prebuilds dir found and $ROOT not present. Trying to extract any archives under current dir (win)..."
            find . -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
              f="$1"; dest="$(dirname "$1")"; echo "Extracting $f into $dest...";
              tar -xf "$f" -C "$dest" 2>/dev/null || tar -xzf "$f" -C "$dest" 2>/dev/null || { command -v unzip >/dev/null 2>&1 && unzip -o "$f" -d "$dest" >/dev/null; } || true
            ' sh {} \; 2>/dev/null || true
            PREBUILDS_DIR=$(find . -type d -name prebuilds -print -quit 2>/dev/null || true)
            echo "[debug] After extraction under dot (win): PREBUILDS_DIR=$PREBUILDS_DIR"
            [ -n "$PREBUILDS_DIR" ] && ls -la "$PREBUILDS_DIR" || true
          fi

          if [ -n "$PREBUILDS_DIR" ] && [ -n "$(ls -A "$PREBUILDS_DIR" 2>/dev/null)" ]; then
            echo "Materializing from: $PREBUILDS_DIR"
            mkdir -p OrcaSlicerAddon/bindings/node/prebuilds

            echo "Listing source prebuilds before copy (win):"
            ls -la "$PREBUILDS_DIR" || true

            cp -R "$PREBUILDS_DIR"/* OrcaSlicerAddon/bindings/node/prebuilds/
            echo "Listing destination prebuilds after copy:"
            ls -la OrcaSlicerAddon/bindings/node/prebuilds || true
          else
            echo "No prebuilds dir found in downloaded windows artifacts or directory is empty"
          fi


      - name: Check if prebuild exists (windows)
        id: check_prebuilt
        shell: bash
        run: |
          DEST="OrcaSlicerAddon/bindings/node/prebuilds"
          WIN_PREBUILD_DIR="$DEST/win32-x64"
          ROOT="prebuild-windows-${{ steps.pkg.outputs.version }}"

          echo "[win-check] Looking for Windows prebuilds in $WIN_PREBUILD_DIR"
          echo "[win-check] Current contents of $DEST:"
          ls -la "$DEST" || echo "Directory does not exist"
          echo "[win-check] Checking for win32-x64 subdirectory:"
          ls -la "$WIN_PREBUILD_DIR" 2>/dev/null || echo "win32-x64 directory does not exist"

          # 0) Try to expose content by extracting any archives (works even if unzip is missing via tar)
          if [ -d "$ROOT" ]; then
            find "$ROOT" -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
              f="$1"; dest="$(dirname "$1")"; echo "[win-gate] Extracting $f into $dest...";
              tar -xf "$f" -C "$dest" 2>/dev/null || tar -xzf "$f" -C "$dest" 2>/dev/null || { command -v unzip >/dev/null 2>&1 && unzip -o "$f" -d "$dest" >/dev/null; } || true
            ' sh {} \; 2>/dev/null || true
          fi
          find . -maxdepth 3 -type f \( -iname "*.zip" -o -iname "*.tar" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
            f="$1"; dest="$(dirname "$1")"; echo "[win-gate] Extracting $f into $dest...";
            tar -xf "$f" -C "$dest" 2>/dev/null || tar -xzf "$f" -C "$dest" 2>/dev/null || { command -v unzip >/dev/null 2>&1 && unzip -o "$f" -d "$dest" >/dev/null; } || true
          ' sh {} \; 2>/dev/null || true

          # 1) Check if Windows-specific prebuild directory exists and has .node files
          if [ -d "$WIN_PREBUILD_DIR" ] && [ -n "$(find "$WIN_PREBUILD_DIR" -maxdepth 1 -name "*.node" -print -quit 2>/dev/null)" ]; then
            echo "[win-check] Found Windows prebuilds in $WIN_PREBUILD_DIR"
            ls -la "$WIN_PREBUILD_DIR"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "[win-check] No Windows prebuilds found in $WIN_PREBUILD_DIR"
            # 2) Search for Windows-specific prebuilds in downloaded artifacts
            # Look for win32-x64 directory or .node files that might be Windows prebuilds
            CANDS=$(find . -maxdepth 12 -type d \( -name "win32-x64" -o -name "win32" \) ! -path "./$DEST/*" -print 2>/dev/null || true)
            SRC=""
            while IFS= read -r d; do
              [ -n "$d" ] || continue
              if [ -n "$(find "$d" -maxdepth 1 -name "*.node" -print -quit 2>/dev/null)" ]; then
                SRC="$d"
                echo "[win-check] Found Windows prebuild candidate: $SRC"
                break
              fi
            done <<< "$CANDS"

            # 3) If found a Windows prebuild directory, materialize it
            if [ -n "$SRC" ]; then
              echo "[win-gate] Materializing Windows prebuilds from $SRC to $WIN_PREBUILD_DIR"
              mkdir -p "$WIN_PREBUILD_DIR"
              cp -R "$SRC"/* "$WIN_PREBUILD_DIR"/ || true
            fi

            # 4) Final decision: check specifically for Windows prebuilds
            if [ -d "$WIN_PREBUILD_DIR" ] && [ -n "$(find "$WIN_PREBUILD_DIR" -maxdepth 1 -name "*.node" -print -quit 2>/dev/null)" ]; then
              echo "[win-check] Windows prebuilds confirmed in $WIN_PREBUILD_DIR"
              ls -la "$WIN_PREBUILD_DIR"
              echo "found=true" >> $GITHUB_OUTPUT
            else
              echo "[win-check] No Windows prebuilds found after search"
              echo "found=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Find repo-wide Orca CLI artifact (Windows)
        if: steps.check_prebuilt.outputs.found == 'false'
        id: find_repo_orcawin
        uses: actions/github-script@v7
        with:
          script: |
            const perPage = 100;
            let page = 1;
            let best = null;
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: perPage,
                page,
              });
              const artifacts = data.artifacts || [];
              if (artifacts.length === 0) break;
              for (const a of artifacts) {
                if (!a.expired && a.name === 'orcaslicer-cli-Windows') {
                  if (!best || new Date(a.created_at) > new Date(best.created_at)) best = a;
                }
              }
              if (artifacts.length < perPage) break;
              page++;
            }
            core.setOutput('run_id', best && best.workflow_run ? String(best.workflow_run.id) : '');
            core.setOutput('artifact_name', best ? best.name : '');

      - name: Download repo-wide Orca CLI (Windows)
        if: steps.check_prebuilt.outputs.found == 'false' && steps.find_repo_orcawin.outputs.run_id != ''
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.find_repo_orcawin.outputs.run_id }}
          name: ${{ steps.find_repo_orcawin.outputs.artifact_name }}
          path: orca-cli-windows
          if_no_artifact_found: ignore

      - name: Materialize Orca CLI artifact into OrcaSlicer
        if: steps.check_prebuilt.outputs.found == 'false' && steps.find_repo_orcawin.outputs.run_id != ''
        shell: bash
        run: |
          echo "Contents of downloaded Orca CLI artifact (orcaslicer-cli-Windows):"
          ls -laR orca-cli-windows || true
          # Extract any nested archives first
          find orca-cli-windows -maxdepth 4 -type f \( -iname "*.zip" -o -iname "*.tar" -o -iname "*.tar.gz" -o -iname "*.tgz" \) -print -exec sh -c '
            f="$1"; dest="$(dirname "$1")"; echo "[cli] Extracting $f into $dest...";
            tar -xf "$f" -C "$dest" 2>/dev/null || tar -xzf "$f" -C "$dest" 2>/dev/null || { command -v unzip >/dev/null 2>&1 && unzip -o "$f" -d "$dest" >/dev/null; } || true
          ' sh {} \; 2>/dev/null || true

          mkdir -p OrcaSlicer
          if [ -d "orca-cli-windows/OrcaSlicer/build" ] || [ -d "orca-cli-windows/OrcaSlicer/deps/build" ]; then
            cp -R orca-cli-windows/OrcaSlicer/* OrcaSlicer/
          else
            CAND=$(find orca-cli-windows -type d -name OrcaSlicer -print -quit 2>/dev/null || true)
            if [ -n "$CAND" ]; then
              cp -R "$CAND"/* OrcaSlicer/
            else
              BUILD_DIR=$(find orca-cli-windows -type d -name build -print -quit 2>/dev/null || true)
              if [ -n "$BUILD_DIR" ]; then
                PARENT="$(dirname "$BUILD_DIR")"
                echo "[cli] Found build dir at $BUILD_DIR; copying parent $PARENT into OrcaSlicer/"
                cp -R "$PARENT"/* OrcaSlicer/
              else
                echo "[cli] No structured build dirs found; copying all contents into OrcaSlicer/"
                cp -R orca-cli-windows/* OrcaSlicer/ || true
              fi
            fi
          fi
          echo "Listing OrcaSlicer after CLI materialization:"
          ls -laR OrcaSlicer || true

      - name: Try download cached Orca build from previous successful run
        if: steps.check_prebuilt.outputs.found == 'false'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: node-addon-prebuilds-amd64.yml
          workflow_conclusion: ""
          name: orca-build-windows
          path: orca-build-windows
          search_artifacts: true
          if_no_artifact_found: ignore

      - name: Materialize cached Orca build into expected location
        if: steps.check_prebuilt.outputs.found == 'false'
        shell: bash
        run: |
          echo "Contents of downloaded Windows cache artifact (orca-build-windows):"
          ls -laR orca-build-windows || true

          # The artifact should contain OrcaSlicer/build/** and OrcaSlicer/deps/build/**
          # Copy directly if the structure is correct
          if [ -d "orca-build-windows/OrcaSlicer/build" ] || [ -d "orca-build-windows/OrcaSlicer/deps/build" ]; then
            echo "Found correct structure in artifact, copying..."
            mkdir -p OrcaSlicer
            cp -R orca-build-windows/OrcaSlicer/* OrcaSlicer/ 2>/dev/null || true
          else
            # Try to find the OrcaSlicer directory anywhere in the artifact
            ORCA_DIR=$(find orca-build-windows -type d -name OrcaSlicer -print -quit 2>/dev/null || true)
            if [ -n "$ORCA_DIR" ]; then
              echo "Found OrcaSlicer directory at: $ORCA_DIR"
              mkdir -p OrcaSlicer
              cp -R "$ORCA_DIR"/* OrcaSlicer/ 2>/dev/null || true
            else
              echo "No OrcaSlicer directory found in artifact, trying to find build directories..."
              # Look for build and deps/build directories directly
              BUILD_DIR=$(find orca-build-windows -type d -path "*/build" -not -path "*/deps/build" -print -quit 2>/dev/null || true)
              DEPS_BUILD_DIR=$(find orca-build-windows -type d -path "*/deps/build" -print -quit 2>/dev/null || true)

              mkdir -p OrcaSlicer
              if [ -n "$BUILD_DIR" ]; then
                echo "Found build directory at: $BUILD_DIR"
                mkdir -p OrcaSlicer/build
                cp -R "$BUILD_DIR"/* OrcaSlicer/build/ 2>/dev/null || true
              fi
              if [ -n "$DEPS_BUILD_DIR" ]; then
                echo "Found deps/build directory at: $DEPS_BUILD_DIR"
                mkdir -p OrcaSlicer/deps/build
                cp -R "$DEPS_BUILD_DIR"/* OrcaSlicer/deps/build/ 2>/dev/null || true
              fi
            fi
          fi

          echo "Listing OrcaSlicer after materialization:"
          ls -laR OrcaSlicer || true

      - name: Check if cached Orca build exists
        if: steps.check_prebuilt.outputs.found == 'false'
        id: check_cache
        shell: bash
        run: |
          # Validate that required libraries actually exist before considering cache valid
          LIBSLIC3R_FOUND=false
          SEMVER_FOUND=false

          # Check for libslic3r.lib in Release or RelWithDebInfo
          if [ -f "OrcaSlicer/build/src/libslic3r/Release/libslic3r.lib" ] || \
             [ -f "OrcaSlicer/build/src/libslic3r/RelWithDebInfo/libslic3r.lib" ]; then
            echo "Found libslic3r.lib"
            LIBSLIC3R_FOUND=true
          fi

          # Check for semver.lib in Release or RelWithDebInfo
          if [ -f "OrcaSlicer/build/lib/Release/semver.lib" ] || \
             [ -f "OrcaSlicer/build/lib/RelWithDebInfo/semver.lib" ]; then
            echo "Found semver.lib"
            SEMVER_FOUND=true
          fi

          # Check if deps are built
          DEPS_FOUND=false
          if [ -d "OrcaSlicer/deps/build/OrcaSlicer_dep" ] && [ -n "$(ls -A "OrcaSlicer/deps/build/OrcaSlicer_dep" 2>/dev/null || true)" ]; then
            echo "Found OrcaSlicer_dep directory"
            DEPS_FOUND=true
          fi

          # Cache is valid only if we have both required libs AND deps
          if [ "$LIBSLIC3R_FOUND" = true ] && [ "$SEMVER_FOUND" = true ] && [ "$DEPS_FOUND" = true ]; then
            echo "Valid cached Orca build found with all required libraries"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "Cached build incomplete or missing required libraries:"
            echo "  libslic3r: $LIBSLIC3R_FOUND"
            echo "  semver: $SEMVER_FOUND"
            echo "  deps: $DEPS_FOUND"
            echo "Contents of OrcaSlicer (if any):"
            ls -laR OrcaSlicer || true
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply Windows CMake path escape fix
        if: steps.check_prebuilt.outputs.found == 'false' && steps.check_cache.outputs.found == 'false'
        shell: bash
        run: |
          # Apply patch to fix CMake path escape issues on Windows
          # (e.g., \a in "slicer-api" being interpreted as an escape sequence)
          cd OrcaSlicer
          git apply --verbose "$GITHUB_WORKSPACE/patches/windows-cmake-path-escape.patch" || {
            echo "Patch already applied or failed, continuing..."
          }

      - name: Clean incomplete ExternalProject source dirs (Windows)
        if: steps.check_prebuilt.outputs.found == 'false' && steps.check_cache.outputs.found == 'false'
        shell: bash
        run: |
          # Remove ExternalProject source directories that may be incomplete from a failed cache
          # These directories need .git to allow CMake ExternalProject to update them
          # If they exist without .git, the build will fail with "fatal: not a git repository"
          DEPS_BUILD="OrcaSlicer/deps/build"
          if [ -d "$DEPS_BUILD" ]; then
            echo "Checking for incomplete ExternalProject source directories..."
            find "$DEPS_BUILD" -maxdepth 2 -type d -name 'dep_*-prefix' | while read prefix_dir; do
              src_dir="$prefix_dir/src"
              if [ -d "$src_dir" ]; then
                for subdir in "$src_dir"/*/; do
                  if [ -d "$subdir" ] && [ ! -d "$subdir/.git" ]; then
                    echo "Removing incomplete source dir (no .git): $subdir"
                    rm -rf "$subdir"
                  fi
                done
              fi
            done
          fi

      - name: Build OrcaSlicer dependencies with CMake
        if: steps.check_prebuilt.outputs.found == 'false' && steps.check_cache.outputs.found == 'false'
        shell: bash
        run: |
          cd OrcaSlicer/deps
          mkdir -p build
          cd build
          # Ensure Strawberry Perl is used (not MSYS Perl), required by OpenSSL build on Windows
          if [ -d "/c/Strawberry/perl/bin" ]; then
            export PATH="/c/Strawberry/perl/bin:$PATH"
          fi
          echo "[perl] which perl: $(which perl || true)"
          perl -v || true
          # Optional: check nmake presence in PATH
          where.exe nmake 2>/dev/null || echo "[warn] where.exe did not find nmake in PATH"
          # Convert DESTDIR to forward slashes to avoid CMake escape issues on Windows
          # (e.g., \a in "slicer-api" being interpreted as an escape sequence)
          DESTDIR_PATH="${GITHUB_WORKSPACE}/OrcaSlicer/deps/build/x64/OrcaSlicer_dep"
          DESTDIR_PATH="${DESTDIR_PATH//\\//}"
          echo "Using DESTDIR: $DESTDIR_PATH"
          cmake .. -G "Visual Studio 17 2022" -A x64 -DDESTDIR="$DESTDIR_PATH" -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF -DORCA_INCLUDE_DEBUG_INFO=OFF
          cmake --build . --config Release --target deps -- -m
          echo "Dependencies built. Listing deps/build:"
          ls -la || dir
          echo "Listing x64/OrcaSlicer_dep:"
          ls -laR x64/OrcaSlicer_dep || dir x64\OrcaSlicer_dep /s || echo "Listing skipped"

      - name: Build OrcaSlicer with CMake
        if: steps.check_prebuilt.outputs.found == 'false' && steps.check_cache.outputs.found == 'false'
        shell: bash
        run: |
          cd OrcaSlicer
          mkdir -p build/x64
          cd build/x64
          # Convert CMAKE_PREFIX_PATH to forward slashes to avoid CMake escape issues on Windows
          PREFIX_PATH="${GITHUB_WORKSPACE}/OrcaSlicer/deps/build/x64/OrcaSlicer_dep/usr/local"
          PREFIX_PATH="${PREFIX_PATH//\\//}"
          echo "Using CMAKE_PREFIX_PATH: $PREFIX_PATH"
          cmake ../.. -G "Visual Studio 17 2022" -A x64 -DBBL_RELEASE_TO_PUBLIC=1 -DORCA_TOOLS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PREFIX_PATH"
          cmake --build . --config Release --target libslic3r libslic3r_cgal semver -- -m
          echo "OrcaSlicer libs built. Listing build/src/libslic3r:"
          ls -laR src/libslic3r || dir src\libslic3r /s

      - name: Upload cached Orca build for reuse
        if: steps.check_prebuilt.outputs.found == 'false' && steps.check_cache.outputs.found == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: orca-build-windows
          path: |
            OrcaSlicer/build/**
            OrcaSlicer/deps/build/**
          if-no-files-found: error
          retention-days: 7

      - name: Build Node addon prebuilds (win32-x64)
        if: steps.check_prebuilt.outputs.found == 'false'
        shell: bash
        env:
          ORCACLI_REQUIRE_LIBS: 'ON'
        run: |
          cd OrcaSlicerAddon/bindings/node
          npm ci
          npm run prebuild:all
          npm run prebuild:stage

      - name: List staged prebuilds
        if: steps.check_prebuilt.outputs.found == 'false'
        working-directory: OrcaSlicerAddon/bindings/node
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/ci/list_staged_prebuilds.sh"

      - name: Upload artifact (prebuild-windows)
        if: steps.check_prebuilt.outputs.found == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-windows-${{ steps.pkg.outputs.version }}
          path: |
            OrcaSlicerAddon/bindings/node/prebuilds/**
          if-no-files-found: error

