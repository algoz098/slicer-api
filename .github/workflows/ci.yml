name: DOCKER CI

on:
  push:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-docker:
    strategy:
      matrix:
        arch: [amd64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest



    name: Build addon base and slicer-api images
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug git submodule status
        run: |
          echo "Git submodule status:"
          git submodule status || true
          echo ""
          echo "Contents of .gitmodules:"
          cat .gitmodules || true
          echo ""
          echo "Current directory contents:"
          ls -la
        shell: bash

      - name: Verify OrcaSlicer submodule
        run: |
          echo "Checking if OrcaSlicer directory exists..."
          ls -la
          if [ ! -d "OrcaSlicer" ] || [ -z "$(ls -A OrcaSlicer 2>/dev/null)" ]; then
            echo "ERROR: OrcaSlicer directory not found or empty after checkout"
            echo "Attempting manual submodule init..."
            git submodule update --init --recursive

            # Verify again after manual init
            if [ ! -d "OrcaSlicer" ] || [ -z "$(ls -A OrcaSlicer 2>/dev/null)" ]; then
              echo "FATAL: Failed to initialize OrcaSlicer submodule"
              exit 1
            fi
          fi

          echo "Checking for version.inc..."
          if [ -f "OrcaSlicer/version.inc" ]; then
            echo "version.inc found:"
            cat OrcaSlicer/version.inc
          else
            echo "ERROR: OrcaSlicer/version.inc not found"
            ls -la OrcaSlicer/ || echo "OrcaSlicer directory is empty or doesn't exist"
            exit 1
          fi
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to GHCR (optional; enables pulling/pushing if needed)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive Orca version/arch
        id: meta
        run: |
          bash scripts/ci/derive_meta.sh
        shell: bash

      - name: Compute image tags from source (owner/version/arch)
        run: |
          lower_owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "DEPS_TAG=ghcr.io/${lower_owner}/orcaslicer-build-deps:${{ steps.meta.outputs.version }}b-${{ matrix.arch }}" >> "$GITHUB_ENV"
          echo "CORE_TAG=ghcr.io/${lower_owner}/orcaslicer-core:${{ steps.meta.outputs.version }}b-${{ matrix.arch }}" >> "$GITHUB_ENV"
          echo "ADDON_CORE_TAG=ghcr.io/${lower_owner}/orcaslicer-addon-core:${{ steps.meta.outputs.version }}b-${{ matrix.arch }}" >> "$GITHUB_ENV"
          echo "ADDON_BASE_TAG=ghcr.io/${lower_owner}/orcaslicer-addon-base:${{ steps.meta.outputs.version }}b-${{ matrix.arch }}" >> "$GITHUB_ENV"
          echo "SLICER_TAG=ghcr.io/${lower_owner}/slicer-api:${{ steps.meta.outputs.version }}b-${{ matrix.arch }}" >> "$GITHUB_ENV"
        shell: bash
      # --- DEPS: check, build, push ---
      - name: Check if DEPS image exists
        id: check_deps
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/ci/check_image_exists.sh "${{ env.DEPS_TAG }}"
        shell: bash

      - name: Build and push DEPS image (target=deps)
        if: steps.check_deps.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: deps
          platforms: ${{ matrix.platform }}
          build-args: |
            ENFORCE_PREBUILT_BASE=false
            BASE_DEPS_IMAGE=debian:bookworm-slim
            CI_MAX_JOBS=2
          push: true
          tags: |
            ${{ env.DEPS_TAG }}

      # --- CORE: check, build, push ---
      - name: Check if CORE image exists
        id: check_core
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/ci/check_image_exists.sh "${{ env.CORE_TAG }}"
        shell: bash

      - name: Build and push CORE image (target=core, reusing deps)
        if: steps.check_core.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: core
          platforms: ${{ matrix.platform }}
          build-args: |
            ENFORCE_PREBUILT_BASE=true
            BASE_DEPS_IMAGE=${{ env.DEPS_TAG }}
            USE_PREBUILT_DEPS=true
            CI_MAX_JOBS=2
          push: true
          tags: |
            ${{ env.CORE_TAG }}

      # --- ADDON CORE: check, build, push ---
      - name: Check if ADDON CORE image exists
        id: check_addon_core
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/ci/check_image_exists.sh "${{ env.ADDON_CORE_TAG }}"
        shell: bash

      - name: Build and push ADDON CORE image (target=addon-core)
        if: steps.check_addon_core.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: addon-core
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_CORE_IMAGE=${{ env.CORE_TAG }}
            CI_MAX_JOBS=2
          push: true
          tags: |
            ${{ env.ADDON_CORE_TAG }}

      # --- ADDON (base): check, build, push ---
      - name: Check if ADDON BASE image exists
        id: check_addon_base
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/ci/check_image_exists.sh "${{ env.ADDON_BASE_TAG }}"
        shell: bash

      - name: Build and push ADDON base image (target=base)
        if: steps.check_addon_base.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: base
          platforms: ${{ matrix.platform }}
          build-args: |
            ENFORCE_PREBUILT_BASE=true
            USE_PREBUILT_DEPS=true
            BASE_DEPS_IMAGE=${{ env.DEPS_TAG }}
            BASE_CORE_IMAGE=${{ env.CORE_TAG }}
            BASE_ADDON_CORE_IMAGE=${{ env.ADDON_CORE_TAG }}
            CI_MAX_JOBS=2
          push: true
          tags: |
            ${{ env.ADDON_BASE_TAG }}

      # --- SLICER API: check, build, push (consumes ADDON base) ---
      - name: Check if SLICER API image exists
        id: check_slicer
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/ci/check_image_exists.sh "${{ env.SLICER_TAG }}"
        shell: bash

      - name: Build and push slicer-api image (consumes addon base)
        if: steps.check_slicer.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: node-api/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            ADDON_BASE=${{ env.ADDON_BASE_TAG }}
          push: true
          tags: |
            ${{ env.SLICER_TAG }}

